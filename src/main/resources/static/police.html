<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Police SOS - ResQHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <header>

        <h2>ResQHub</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="emergency.html">Report Emergency</a>
            <a href="hospital.html">Hospitals</a>
            <a href="ambulance.html">Ambulance</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- Police SOS Section -->

    <main>

        <section class="emergency-page">

            <div class="emergency-header">

                <p class="section-tag">
                    POLICE EMERGENCY
                </p>

                <h1>
                    Police SOS Alert
                </h1>

                <p>
                    Send an emergency alert to the nearest
                    available police station.
                </p>

            </div>


            <!-- SOS Form -->

            <div class="emergency-form">

                <label for="area">
                    Emergency Area
                </label>

                <input
                    type="text"
                    id="area"
                    placeholder="Enter emergency area"
                    required
                >


                <label for="description">
                    Emergency Description
                </label>

                <textarea
                    id="description"
                    rows="5"
                    placeholder="Describe the emergency"
                    required
                ></textarea>


                <button id="police-sos-btn"
                    class="emergency-btn"
                    onclick="sendPoliceSOS()">

                    🚨 Send Police SOS

                </button>
                <p id="police-message" role="status"></p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ResQHub. All rights reserved.
        </p>

    </footer>


    <script>

        async function sendPoliceSOS() {

            const area =
                document.getElementById("area").value.trim();

            const description =
                document.getElementById("description").value.trim();

            const message = document.getElementById("police-message");
            const button = document.getElementById("police-sos-btn");


            if (area === "" || description === "") {

                message.textContent = "Please enter the emergency area and description.";

                return;
            }


            button.disabled = true;
            message.textContent = "Sending police SOS...";

            try {
                const params = new URLSearchParams({ area, description });
                const response = await fetch("/api/police/sos-alert?" + params.toString(), {
                    method: "POST"
                });
                const result = await response.text();
                message.textContent = result;
                message.style.color = response.ok ? "#22c55e" : "#ef4444";
            } catch (error) {
                message.textContent = "Unable to send police SOS.";
                message.style.color = "#ef4444";
            } finally {
                button.disabled = false;
            }

        }

    </script>

</body>

</html>
