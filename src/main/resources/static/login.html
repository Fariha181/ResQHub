<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ResQHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <h2>ResQHub</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="emergency.html">Report Emergency</a>
            <a href="hospital.html">Hospitals</a>
            <a href="ambulance.html">Ambulance</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <!-- Login Section -->
    <main>

        <section class="login-page">

            <div class="login-header">

                <p class="section-tag">RESQHUB ACCOUNT</p>

                <h1>Welcome Back</h1>

                <p>
                    Login to access your ResQHub emergency
                    response services.
                </p>

            </div>


            <!-- Login Form -->
            <div class="login-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address">

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password">

                </div>


                <button class="login-btn" onclick="loginUser()">
                    Login
                </button>


                <p class="login-footer">
                    Don't have an account?
                    <a href="#">Register</a>
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 ResQHub. All rights reserved.</p>
    </footer>


    <script>
        function loginUser() {
            alert("Login successful!");
        }
    </script>

</body>

</html>
