<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Emergency - ResQHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <h2>ResQHub</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="emergency.html">Report Emergency</a>
            <a href="#">Hospitals</a>
            <a href="#">Login</a>
        </nav>
    </header>


    <!-- Emergency Report Section -->
    <main>

        <section class="emergency-page">

            <div class="emergency-header">

                <p class="section-tag">EMERGENCY RESPONSE</p>

                <h1>Report an Emergency</h1>

                <p>
                    Provide the emergency details below so that
                    the response team can take appropriate action quickly.
                </p>

            </div>


            <!-- Emergency Form -->
            <div class="emergency-form">

                <div class="form-group">
                    <label for="emergency-type">
                        Emergency Type
                    </label>

                    <select id="emergency-type">
                        <option value="">Select emergency type</option>
                        <option value="MEDICAL">Medical Emergency</option>
                        <option value="ACCIDENT">Accident</option>
                        <option value="FIRE">Fire</option>
                        <option value="NATURAL_DISASTER">Natural Disaster</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="location">
                        Emergency Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter emergency location">
                </div>


                <div class="form-group">
                    <label for="description">
                        Emergency Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Describe the emergency situation"></textarea>
                </div>


                <div class="form-group">
                    <label for="people">
                        Number of People Affected
                    </label>

                    <input
                        type="number"
                        id="people"
                        placeholder="Enter number of people">
                </div>


                <div class="form-group">
                    <label for="phone">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter contact number">
                </div>

              <button class="emergency-btn" id="submit-emergency-btn" onclick="submitEmergency()">
              Submit Emergency Report
              </button>

              <p id="incident-message" role="status"></p>

                
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 ResQHub. All rights reserved.</p>
    </footer>
<script>
async function submitEmergency() {
    const type = document.getElementById("emergency-type").value;
    const location = document.getElementById("location").value.trim();
    const description = document.getElementById("description").value.trim();
    const message = document.getElementById("incident-message");
    const submitButton = document.getElementById("submit-emergency-btn");
    const typeLabel = document.getElementById("emergency-type").selectedOptions[0].text;

    message.textContent = "Submitting emergency report...";
    submitButton.disabled = true;

    try {
        const response = await fetch("/api/incidents", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                title: typeLabel,
                incidentType: type,
                location: location,
                description: description
            })
        });

        const data = await response.json();

        if (!response.ok) {
            const errors = data.fieldErrors ? Object.values(data.fieldErrors).join(" ") : data.error;
            throw new Error(errors || "Unable to submit emergency report.");
        }

        message.textContent = "Report #" + data.id + " submitted. Assigned agency: " + data.assignedAgency + ".";
    } catch (error) {
        message.textContent = error.message || "Unable to submit emergency report.";
    } finally {
        submitButton.disabled = false;
    }
}
</script>

</body>

</html>
